<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>お支払いのご案内 | dan.</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{background:#f9f9f7;color:#171717;font-family:Inter,"Noto Sans JP",sans-serif;margin:0;line-height:1.8}.shell{width:min(100% - 40px,800px);margin:auto}header{padding:25px 0;border-bottom:1px solid #ddd}.logo{font-size:26px;font-weight:700;letter-spacing:-.09em}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}main{padding:110px 0 140px;min-height:65vh}.eyebrow{font-size:11px;letter-spacing:.15em;color:#777}h1{font-size:clamp(42px,7vw,72px);font-weight:550;letter-spacing:-.06em;line-height:1.25;margin:20px 0 25px}p{font-size:13px;max-width:650px;color:#666}a.back{display:inline-block;margin-top:29px;padding:13px 19px;border:1px solid #111;font-size:12px;font-weight:600}footer{padding:26px 0;border-top:1px solid #ddd;font-size:11px;color:#888}</style></head><body><header><div class="shell"><a class="logo" href="/">dan.</a></div></header><main class="shell"><div class="eyebrow">CHECKOUT / PAYMENT STATUS</div><h1>お申し込みありがとうございます。</h1><p id="payment-status" role="status" aria-live="polite">Stripeの決済状況を確認しています。お申し込み画面に戻ったことだけでは、お支払い完了にはなりません。</p><p>Stripeからの領収メールをご確認ください。ご不明な点があれば、XのDMからお問い合わせください。</p><a class="back" href="/">サイトに戻る ↗</a></main><footer class="shell">© dan.</footer><script>
(() => {
  const msg=document.getElementById('payment-status');
  const id=new URLSearchParams(location.search).get('session_id');
  if(!id || !/^cs_[A-Za-z0-9_]{10,200}$/.test(id)){
    msg.textContent='決済番号がありません。Stripeのお支払い履歴をご確認ください。';return;
  }
  let count=0;
  const check=async()=>{
    try{
      const r=await fetch('/api/order-status?session_id='+encodeURIComponent(id),{cache:'no-store'});
      if(!r.ok)throw Error('Not found');
      const data=await r.json();
      if(data.status==='paid'){msg.textContent='お支払いを確認しました。ご依頼内容を確認し、制作スケジュールをご連絡します。';return;}
      if(data.status==='failed'){msg.textContent='お支払いを確認できませんでした。Stripeのご案内をご確認ください。';return;}
      if(data.status==='expired'){msg.textContent='お支払いの有効期限が切れています。再度お申し込みください。';return;}
      msg.textContent='Stripeからの決済完了通知を確認中です。確定後にご連絡します。';
    }catch{msg.textContent='決済結果の確認中です。Stripeの領収メールをご確認ください。';}
    if(++count<5)setTimeout(check,2500);
  };
  check();
})();
</script></body></html>
