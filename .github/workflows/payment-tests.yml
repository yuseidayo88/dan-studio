name: Stripe Checkout integration tests
on:
  push:
    paths:
      - "public/_worker.js"
      - "src/index.js"
      - "tests/**"
      - ".github/workflows/payment-tests.yml"
  pull_request:
    paths:
      - "public/_worker.js"
      - "src/index.js"
      - "tests/**"
      - ".github/workflows/payment-tests.yml"
jobs:
  payment-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run payment tests
        run: node --test tests/payment.test.mjs
